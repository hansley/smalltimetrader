[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smalltimetrader"
version = "0.1.0"
description = "Three-exchange monitoring, WhatsApp alerts and guarded Binance spot trading"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.12,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "cryptography>=44,<49"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
smalltimetrader = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
